[workspace]
resolver = "2"
members = [
  "crates/transpiler-core",
  "crates/transpiler-rt",
  "crates/frontend-javascript",
  "crates/frontend-typescript",
  "crates/frontend-python",
  "crates/frontend-go",
  "crates/frontend-java",
  "crates/frontend-kotlin",
  "crates/backend-rust",
  "crates/verifier-z3",
  "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["abdallh-rgx"]

[profile.release]
opt-level = 2
